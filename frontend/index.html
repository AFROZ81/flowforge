<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FlowForge — enterprise project management for teams that build software together." />
    <!--
      Set at runtime from the active theme's --background token (see
      providers/AppProvider.tsx), so it can never disagree with the palette.
      This value is only the first-paint placeholder for a browser that runs
      no script — a <meta> cannot reference a CSS variable, which is the one
      legitimate place a literal colour survives.
    -->
    <meta name="theme-color" content="#f5f7fa" />
    <title>FlowForge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
